name: rino-sentinel

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  rino-sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: DonatoReis/rino-sentinel@v0.1.5
        with:
          github-token: ${{ github.token }}
          fail-on-findings: "false"
